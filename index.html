<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopEase — Mock Store</title>
<style>
:root{--ink:#182230;--muted:#667085;--line:#e5e9ef;--brand:#315ee8;--brand2:#2448bd;--bg:#f6f8fb;--green:#138a58;--red:#c43232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{max-width:1120px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:22px}.logo{font-weight:850;font-size:24px;letter-spacing:-1px;color:var(--brand);white-space:nowrap}.search{flex:1;display:flex;min-width:120px}.search input{width:100%;border:1px solid var(--line);border-radius:9px 0 0 9px;padding:11px 13px;background:#fbfcfe}.search button{border:0;background:var(--brand);color:#fff;padding:0 17px;border-radius:0 9px 9px 0;font-weight:700}.navlinks{display:flex;gap:15px;align-items:center;white-space:nowrap;font-weight:650}.cartlink{background:#eef2ff;color:var(--brand);padding:8px 12px;border-radius:9px}.container{max-width:1120px;margin:30px auto;padding:0 22px}.hero{background:linear-gradient(120deg,#182d68,#315ee8);color:white;border-radius:20px;padding:38px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 12px;letter-spacing:-1.5px}.hero p{color:#dbe4ff;margin:0 0 20px}.hero-art{font-size:88px;filter:drop-shadow(0 10px 12px #14265c66)}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:11px 16px;background:var(--brand);color:white;font-weight:750}.btn:hover{background:var(--brand2)}.btn.secondary{background:#eef2ff;color:var(--brand)}.btn.outline{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff1f1;color:var(--red)}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:25px 0 14px}.sectionhead h2{margin:0;font-size:24px;letter-spacing:-.5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}.product:hover{transform:translateY(-3px);box-shadow:0 10px 24px #1b2b4510}.productimg{height:170px;background:#f0f3f9;display:flex;align-items:center;justify-content:center;font-size:64px}.productbody{padding:15px;display:flex;flex-direction:column;flex:1}.tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--brand)}.product h3{font-size:16px;margin:5px 0 8px}.price{font-size:19px;font-weight:850}.product .btn{margin-top:12px;width:100%}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px}.narrow{max-width:520px;margin:35px auto}.formtitle{margin:0 0 5px;font-size:28px;letter-spacing:-.8px}.field{margin:16px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #d9dee7;border-radius:9px;background:#fff}.field input:focus,.field select:focus{outline:3px solid #315ee822;border-color:var(--brand)}.formerror{color:var(--red);font-size:13px;margin-top:5px}.success{background:#eaf8f0;color:#126b45;border:1px solid #c5ead5;padding:12px 14px;border-radius:9px;margin:14px 0}.error{background:#fff0f0;color:#a42626;border:1px solid #f2cccc;padding:12px 14px;border-radius:9px;margin:14px 0}.row{display:flex;gap:18px}.grow{flex:1}.side{width:330px;flex-shrink:0}.cartrow{display:grid;grid-template-columns:65px 1fr auto auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.miniimg{width:65px;height:65px;border-radius:10px;background:#f0f3f9;display:grid;place-items:center;font-size:30px}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px}.summaryline{display:flex;justify-content:space-between;margin:10px 0}.summaryline.total{font-weight:850;font-size:19px;border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.steps{display:flex;gap:8px;margin-bottom:22px}.step{flex:1;text-align:center;padding:9px;border-radius:8px;background:#e9edf4;color:#697386;font-weight:700;font-size:12px}.step.active{background:#e8edff;color:var(--brand)}.paymentoption{border:1px solid var(--line);padding:14px;border-radius:10px;margin:9px 0;display:flex;gap:10px;align-items:center}.paymentoption:has(input:checked){border-color:var(--brand);background:#f5f7ff}.empty{text-align:center;padding:50px 20px}.empty .big{font-size:56px}.footer{text-align:center;color:var(--muted);padding:35px 15px;font-size:13px}.badge{background:#edf8f2;color:var(--green);padding:4px 8px;border-radius:20px;font-size:12px;font-weight:750}.orderbox{border:1px solid var(--line);border-radius:12px;padding:15px;margin:15px 0}.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{flex-wrap:wrap;gap:12px}.search{order:3;flex-basis:100%}.navlinks{margin-left:auto}.row{flex-direction:column}.side{width:100%}.hero{padding:28px}.hero-art{font-size:60px}}
@media(max-width:520px){.container{padding:0 14px;margin:20px auto}.grid{gap:10px}.productimg{height:130px;font-size:50px}.productbody{padding:11px}.hero{padding:24px}.hero-art{display:none}.cartrow{grid-template-columns:52px 1fr auto;gap:10px}.cartrow .qty{grid-column:2}.cartrow .itemtotal{grid-column:3;grid-row:1}.miniimg{width:52px;height:52px}.card{padding:18px}}
</style>
</head>
<body>
<header class="topbar"><nav class="nav"><a class="logo" href="#/">ShopEase<span style="color:#ff9e42">.</span></a><form class="search" id="searchForm"><input id="searchInput" data-testid="search-input" placeholder="Search products..." aria-label="Search products"><button data-testid="search-submit" type="submit">Search</button></form><div class="navlinks"><a href="#/login" id="accountLink" data-testid="account-link">Login</a><a href="#/cart" class="cartlink" data-testid="cart-link">Cart <span id="cartCount">0</span></a></div></nav></header>
<main id="app" class="container"></main><footer class="footer">ShopEase Mock Store · Demo environment · No real payments are processed</footer>
<script>
(()=>{
const PRODUCTS=[
{id:'sku-headphones',name:'Wireless Headphones',category:'Electronics',price:2499,emoji:'🎧',desc:'Immersive sound with comfortable over-ear cushions.'},
{id:'sku-watch',name:'Smart Watch',category:'Electronics',price:3299,emoji:'⌚',desc:'Track your day with a bright touch display.'},
{id:'sku-backpack',name:'Everyday Backpack',category:'Accessories',price:1299,emoji:'🎒',desc:'A lightweight backpack for work and travel.'},
{id:'sku-mug',name:'Ceramic Coffee Mug',category:'Home',price:399,emoji:'☕',desc:'A sturdy ceramic mug for your daily coffee.'},
{id:'sku-shoes',name:'Running Sneakers',category:'Fashion',price:2199,emoji:'👟',desc:'Lightweight sneakers for everyday movement.'},
{id:'sku-camera',name:'Instant Camera',category:'Electronics',price:4599,emoji:'📷',desc:'Capture and keep your favorite moments.'},
{id:'sku-lamp',name:'Desk Lamp',category:'Home',price:899,emoji:'💡',desc:'A compact lamp for your desk or bedside.'},
{id:'sku-bottle',name:'Steel Water Bottle',category:'Accessories',price:599,emoji:'🧴',desc:'Reusable insulated bottle for everyday use.'}
];
const $=s=>document.querySelector(s), app=$('#app');const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const read=(k,fb)=>{try{return JSON.parse(localStorage.getItem('shopease_'+k))??fb}catch{return fb}};
const write=(k,v)=>localStorage.setItem('shopease_'+k,JSON.stringify(v));
let cart=read('cart',[]),user=read('user',null),orders=read('orders',[]),checkout=read('checkout',{}),searchTerm='';
function count(){return cart.reduce((s,i)=>s+i.qty,0)}function subtotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function sync(){write('cart',cart);$('#cartCount').textContent=count();$('#accountLink').textContent=user?'Hi, '+user.firstName:'Login'}
function go(path){location.hash=path}function current(){return location.hash.replace(/^#\/?/,'').split('/')[0]||'home'}
function item(id){return PRODUCTS.find(p=>p.id===id)}
function productCard(p){return `<article class="product" data-testid="product-card" data-product-id="${p.id}"><div class="productimg">${p.emoji}</div><div class="productbody"><span class="tag">${p.category}</span><h3 data-testid="product-name">${p.name}</h3><p class="muted" style="font-size:13px;margin:0 0 10px">${p.desc}</p><div class="price">${money(p.price)}</div><button class="btn" data-testid="add-to-cart" data-add="${p.id}">Add to cart</button></div></article>`}
function shell(title,content){app.innerHTML=`<div class="sectionhead"><div><h2>${title}</h2></div><a class="muted" href="#/">← Continue shopping</a></div>${content}`}
function home(){const term=new URLSearchParams(location.hash.split('?')[1]||'').get('q')||'';searchTerm=term;$('#searchInput').value=term;const filtered=PRODUCTS.filter(p=>(p.name+' '+p.category+' '+p.desc).toLowerCase().includes(term.toLowerCase()));app.innerHTML=`<section class="hero"><div><h1>Find your<br>everyday favorites.</h1><p>Good products. Great prices. Simple shopping.</p><a href="#products" class="btn" style="background:white;color:#2448bd">Explore products</a></div><div class="hero-art">🛍️</div></section><div class="sectionhead" id="products"><div><h2>${term?'Search results':'Popular products'}</h2><div class="muted">${term?`${filtered.length} result(s) for “${escapeHtml(term)}”`:'Thoughtfully picked essentials for your day'}</div></div></div>${filtered.length?`<div class="grid">${filtered.map(productCard).join('')}</div>`:`<div class="card empty"><div class="big">🔎</div><h3>No products found</h3><p class="muted">Try a different search term.</p><button class="btn secondary" data-testid="clear-search">Clear search</button></div>`}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function register(){shell('Create your account',`<div class="card narrow"><h1 class="formtitle">Join ShopEase</h1><p class="muted">Create an account to start shopping.</p><form id="registerForm" data-testid="register-form"><div id="formMessage"></div><div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" data-testid="register-first-name" autocomplete="given-name" required minlength="2"></div><div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" data-testid="register-last-name" autocomplete="family-name" required minlength="2"></div><div class="field"><label for="regEmail">Email address</label><input id="regEmail" name="email" data-testid="register-email" type="email" autocomplete="email" required></div><div class="field"><label for="regPassword">Password</label><input id="regPassword" name="password" data-testid="register-password" type="password" autocomplete="new-password" minlength="6" required><small class="muted">At least 6 characters</small></div><button class="btn" data-testid="register-submit" type="submit" style="width:100%">Create account</button></form><p class="muted">Already registered? <a href="#/login" style="color:var(--brand);font-weight:700">Login</a></p></div>`)}
function login(){shell('Login',`<div class="card narrow"><h1 class="formtitle">Welcome back</h1><p class="muted">Sign in to your ShopEase account.</p><form id="loginForm" data-testid="login-form"><div id="formMessage"></div><div class="field"><label for="loginEmail">Email address</label><input id="loginEmail" data-testid="login-email" type="email" autocomplete="email" required value="${escapeHtml(user?.email||'')}"></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" data-testid="login-password" type="password" autocomplete="current-password" required></div><button class="btn" data-testid="login-submit" type="submit" style="width:100%">Login</button></form><p class="muted">New to ShopEase? <a href="#/register" style="color:var(--brand);font-weight:700">Create an account</a></p></div>`)}
function cartPage(){if(!cart.length){shell('Your cart',`<div class="card empty"><div class="big">🛒</div><h3>Your cart is empty</h3><p class="muted">Looks like you haven't added anything yet.</p><a class="btn" data-testid="continue-shopping" href="#/">Start shopping</a></div>`);return}shell('Your cart',`<div class="row"><div class="card grow" style="padding:10px 22px">${cart.map(i=>{const p=item(i.id);return `<div class="cartrow" data-testid="cart-item" data-product-id="${i.id}"><div class="miniimg">${p.emoji}</div><div><strong>${p.name}</strong><div class="muted">${money(i.price)} each</div><button class="btn danger" data-remove="${i.id}" data-testid="remove-item" style="padding:4px 8px;font-size:12px;margin-top:5px">Remove</button></div><div class="qty"><button aria-label="Decrease quantity" data-qty="${i.id}" data-delta="-1" data-testid="decrease-quantity">−</button><span data-testid="item-quantity">${i.qty}</span><button aria-label="Increase quantity" data-qty="${i.id}" data-delta="1" data-testid="increase-quantity">+</button></div><strong class="itemtotal">${money(i.price*i.qty)}</strong></div>`}).join('')}</div><aside class="card side"><h3 style="margin-top:0">Order summary</h3><div class="summaryline"><span>Subtotal</span><strong data-testid="cart-subtotal">${money(subtotal())}</strong></div><div class="summaryline"><span>Shipping</span><span>Free</span></div><div class="summaryline total"><span>Total</span><span data-testid="cart-total">${money(subtotal())}</span></div><button class="btn" data-testid="proceed-checkout" style="width:100%;margin-top:12px" data-go="checkout">Proceed to checkout</button></aside></div>`)}
function checkoutPage(){if(!cart.length){go('cart');return}if(!user){shell('Checkout',`<div class="card empty"><h3>Please login to continue</h3><p class="muted">Your cart will be saved.</p><a class="btn" data-testid="checkout-login" href="#/login">Login</a></div>`);return}shell('Checkout',`<div class="steps"><div class="step active">1. Address</div><div class="step">2. Payment</div><div class="step">3. Confirmation</div></div><div class="row"><div class="card grow"><h3 style="margin-top:0">Delivery details</h3><form id="checkoutForm" data-testid="checkout-form"><div id="formMessage"></div><div class="field"><label for="fullName">Full name</label><input id="fullName" data-testid="checkout-full-name" required value="${escapeHtml(user.firstName+' '+user.lastName)}"></div><div class="field"><label for="phone">Phone number</label><input id="phone" data-testid="checkout-phone" type="tel" pattern="[0-9]{10}" minlength="10" maxlength="10" required placeholder="10-digit mobile number" value="${escapeHtml(checkout.phone||'')}"></div><div class="field"><label for="address">Street address</label><input id="address" data-testid="checkout-address" required minlength="5" placeholder="House number, street, area" value="${escapeHtml(checkout.address||'')}"></div><div class="row"><div class="field grow"><label for="city">City</label><input id="city" data-testid="checkout-city" required value="${escapeHtml(checkout.city||'')}"></div><div class="field grow"><label for="postalCode">PIN code</label><input id="postalCode" data-testid="checkout-postal-code" required pattern="[0-9]{6}" maxlength="6" placeholder="6 digits" value="${escapeHtml(checkout.postalCode||'')}"></div></div><button class="btn" data-testid="continue-to-payment" type="submit">Continue to payment</button></form></div><aside class="card side"><h3 style="margin-top:0">Order summary</h3>${cart.map(i=>`<div class="summaryline"><span>${item(i.id).name} × ${i.qty}</span><strong>${money(i.price*i.qty)}</strong></div>`).join('')}<div class="summaryline total"><span>Total</span><span>${money(subtotal())}</span></div></aside></div>`)}
function paymentPage(){if(!cart.length){go('cart');return}if(!checkout.address){go('checkout');return}shell('Payment',`<div class="steps"><div class="step">1. Address</div><div class="step active">2. Payment</div><div class="step">3. Confirmation</div></div><div class="row"><div class="card grow"><h3 style="margin-top:0">Choose payment method</h3><p class="muted">All payment options are simulated for testing.</p><form id="paymentForm" data-testid="payment-form"><div id="formMessage"></div><label class="paymentoption"><input type="radio" name="paymentMethod" value="card" data-testid="payment-card" checked><span><strong>Credit / Debit Card</strong><br><small class="muted">Demo card — no real transaction</small></span></label><div id="cardFields"><div class="field"><label for="cardName">Name on card</label><input id="cardName" data-testid="card-name" autocomplete="cc-name" required value="${escapeHtml(user.firstName+' '+user.lastName)}"></div><div class="field"><label for="cardNumber">Card number</label><input id="cardNumber" data-testid="card-number" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" pattern="[0-9 ]{13,19}" required></div><div class="row"><div class="field grow"><label for="expiry">Expiry</label><input id="expiry" data-testid="card-expiry" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])/[0-9]{2}" required></div><div class="field grow"><label for="cvv">CVV</label><input id="cvv" data-testid="card-cvv" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{3,4}" required></div></div></div><label class="paymentoption"><input type="radio" name="paymentMethod" value="upi" data-testid="payment-upi"><span><strong>UPI</strong><br><small class="muted">Mock UPI payment</small></span></label><div id="upiFields" class="hidden"><div class="field"><label for="upiId">UPI ID</label><input id="upiId" data-testid="upi-id" placeholder="name@bank" pattern="[A-Za-z0-9._-]+@[A-Za-z0-9.-]+"></div></div><label class="paymentoption"><input type="radio" name="paymentMethod" value="cod" data-testid="payment-cod"><span><strong>Cash on Delivery</strong><br><small class="muted">Pay when your order arrives</small></span></label><button class="btn" data-testid="place-order" type="submit" style="width:100%;margin-top:15px">Pay ${money(subtotal())} & Place order</button><p class="muted" style="font-size:12px">Demo checkout only. Do not enter real card details.</p></form></div><aside class="card side"><h3 style="margin-top:0">Order total</h3><div class="summaryline"><span>Items</span><strong>${count()}</strong></div><div class="summaryline"><span>Subtotal</span><strong>${money(subtotal())}</strong></div><div class="summaryline"><span>Shipping</span><span>Free</span></div><div class="summaryline total"><span>Total</span><span data-testid="payment-total">${money(subtotal())}</span></div><a href="#/checkout" class="muted">← Edit delivery details</a></aside></div>`)}
function confirmation(){const order=orders[0];if(!order){go('');return}shell('Order confirmed',`<div class="card narrow" style="text-align:center"><div style="font-size:60px">✅</div><span class="badge">Order placed successfully</span><h1 class="formtitle" style="margin-top:12px">Thank you for your order!</h1><p class="muted">Your mock order has been created.</p><div class="orderbox" style="text-align:left"><div class="summaryline"><span>Order number</span><strong data-testid="order-number">${order.id}</strong></div><div class="summaryline"><span>Order date</span><strong>${new Date(order.date).toLocaleDateString('en-IN')}</strong></div><div class="summaryline"><span>Payment method</span><strong data-testid="order-payment-method">${order.method}</strong></div><div class="summaryline total"><span>Total paid</span><span data-testid="order-total">${money(order.total)}</span></div></div><p data-testid="order-success-message" class="success">Your order is confirmed. This is a simulated transaction.</p><a class="btn" data-testid="continue-shopping" href="#/">Continue shopping</a></div>`)}
function render(){sync();switch(current()){case'register':register();break;case'login':login();break;case'cart':cartPage();break;case'checkout':checkoutPage();break;case'payment':paymentPage();break;case'confirmation':confirmation();break;default:home()}}
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();go('/?q='+encodeURIComponent($('#searchInput').value.trim()))});
app.addEventListener('click',e=>{const add=e.target.closest('[data-add]');if(add){const p=item(add.dataset.add),found=cart.find(i=>i.id===p.id);if(found)found.qty++;else cart.push({id:p.id,price:p.price,qty:1});sync();const old=add.textContent;add.textContent='Added ✓';add.classList.add('secondary');setTimeout(()=>{if(add.isConnected){add.textContent=old;add.classList.remove('secondary')}},900);return}const qty=e.target.closest('[data-qty]');if(qty){const it=cart.find(i=>i.id===qty.dataset.qty);if(it){it.qty+=Number(qty.dataset.delta);if(it.qty<1)cart=cart.filter(i=>i.id!==it.id);render()}return}const rem=e.target.closest('[data-remove]');if(rem){cart=cart.filter(i=>i.id!==rem.dataset.remove);render();return}const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return}if(e.target.closest('[data-testid="clear-search"]'))go('/')});
app.addEventListener('change',e=>{if(e.target.name==='paymentMethod'){const card=e.target.value==='card',upi=e.target.value==='upi';$('#cardFields').classList.toggle('hidden',!card);$('#upiFields').classList.toggle('hidden',!upi);$('#cardFields').querySelectorAll('input').forEach(i=>i.required=card);$('#upiId').required=upi}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='registerForm'){const f=e.target,first=$('#firstName').value.trim(),last=$('#lastName').value.trim(),email=$('#regEmail').value.trim().toLowerCase(),password=$('#regPassword').value;if(user&&user.email===email){$('#formMessage').innerHTML='<div class="error" data-testid="register-error">An account with this email already exists.</div>';return}user={firstName:first,lastName:last,email,password};write('user',user);sync();go('login');return}if(e.target.id==='loginForm'){const email=$('#loginEmail').value.trim().toLowerCase(),password=$('#loginPassword').value;if(!user||user.email!==email||user.password!==password){$('#formMessage').innerHTML='<div class="error" data-testid="login-error">Invalid email or password. Please try again.</div>';return}user={...user};write('user',user);sync();go('');return}if(e.target.id==='checkoutForm'){checkout={fullName:$('#fullName').value.trim(),phone:$('#phone').value.trim(),address:$('#address').value.trim(),city:$('#city').value.trim(),postalCode:$('#postalCode').value.trim()};write('checkout',checkout);go('payment');return}if(e.target.id==='paymentForm'){const method=new FormData(e.target).get('paymentMethod');if(method==='card'){const digits=$('#cardNumber').value.replace(/\s/g,'');if(digits.length<13||digits.length>19||!/^[0-9]+$/.test(digits)){$('#formMessage').innerHTML='<div class="error" data-testid="payment-error">Enter a valid demo card number.</div>';return}}if(method==='upi'&&!$('#upiId').value.trim()){$('#formMessage').innerHTML='<div class="error" data-testid="payment-error">Enter your UPI ID.</div>';return}const order={id:'SE-'+Date.now().toString().slice(-8),date:new Date().toISOString(),items:cart.map(i=>({...i})),total:subtotal(),method:method==='card'?'Card':method==='upi'?'UPI':'Cash on Delivery',shipping:{...checkout}};orders.unshift(order);write('orders',orders);cart=[];write('cart',cart);checkout={};write('checkout',checkout);go('confirmation')}});
window.addEventListener('hashchange',render);if(!location.hash)location.hash='/';render();
})();
</script>
</body>
</html>
